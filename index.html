<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155eef">
  <title>Demo OTP Mock</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 560px; margin: 0 auto; padding: 2rem 1rem; color: #172033; }
    main { border: 1px solid #d9deea; border-radius: 16px; padding: 1.5rem; }
    h1 { margin-top: 0; }
    button { border: 0; border-radius: 8px; padding: .85rem 1rem; background: #155eef; color: white; font: inherit; font-weight: 650; }
    #code { min-height: 2.5rem; font-size: 2rem; font-weight: 700; letter-spacing: .15em; }
    #status { min-height: 1.5rem; }
    .note { color: #505b70; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Demo OTP Mock</h1>
    <p class="note">Demo ini menjana kod palsu dan notifikasi pada peranti ini sahaja. Ia tidak menghantar SMS atau menghubungi nombor telefon.</p>
    <button id="generate" type="button">Jana OTP demo</button>
    <p id="code" aria-live="polite"></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector('#generate');
    const codeOutput = document.querySelector('#code');
    const statusOutput = document.querySelector('#status');
    let serviceWorkerReady = false;

    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then(() => { serviceWorkerReady = true; })
        .catch(() => { statusOutput.textContent = 'Notifikasi mungkin tidak tersedia; kod masih boleh dijana di halaman.'; });
    }

    function makeCode() {
      const values = new Uint32Array(1);
      crypto.getRandomValues(values);
      return String(values[0] % 1000000).padStart(6, '0');
    }

    button.addEventListener('click', async () => {
      const code = makeCode();
      codeOutput.textContent = `Kod demo: ${code}`;
      statusOutput.textContent = 'Kod ini hanya untuk demo dan tidak dihantar melalui SMS.';

      if (!('Notification' in window) || !('serviceWorker' in navigator)) {
        statusOutput.textContent += ' Pelayar ini tidak menyokong notifikasi web; kod dipaparkan di halaman.';
        return;
      }

      try {
        const permission = Notification.permission === 'granted'
          ? 'granted'
          : await Notification.requestPermission();
        if (permission !== 'granted') {
          statusOutput.textContent = 'Kebenaran notifikasi tidak diberi. Kod demo tetap dipaparkan di halaman.';
          return;
        }
        await navigator.serviceWorker.ready;
        const registration = await navigator.serviceWorker.getRegistration('./');
        await registration.showNotification('OTP Demo (palsu)', {
          body: `Kod demo anda: ${code}`,
          tag: 'otp-mock-demo',
          data: { url: './' }
        });
        statusOutput.textContent = 'Notifikasi demo dihantar kepada pelayar pada peranti ini sahaja.';
      } catch (error) {
        statusOutput.textContent = 'Notifikasi tidak dapat dipaparkan. Kod demo masih tertera di halaman.';
      }
    });
  </script>
</body>
</html>
